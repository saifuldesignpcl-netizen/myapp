name: Build Flet APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet

    - name: Clean Old Build Files
      run: |
        rm -rf build/ dist/

    - name: Build APK with Flet
      run: |
        flet build apk . --module-name math --product "Math Practice Pro" --org com.saiful.mathpro --verbose --yes

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: math-app-release-apk
        path: build/apk/*.apk
